name: Gradle verification

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Test, check style, and build
        run: xvfb-run -a ./gradlew test checkstyleMain checkstyleTest check build shadowJar
      - uses: actions/upload-artifact@v4
        with:
          name: HotShop-linux
          path: release/HotShop.jar
